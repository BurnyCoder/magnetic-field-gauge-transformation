<script>
// Global: this closure owns one explainer; local: no network calls or global application state are needed.
(() => {
  const root = document.getElementById("exercise-three-gauge"); // Use an explicit root even when the host relocates scripts.
  const slider = root.querySelector("#gauge-slider"); // Keep the single accessible interaction local.
  const valueLabel = root.querySelector("#gauge-value"); // Report the exact slider value beside its label.
  const stateLabel = root.querySelector("#gauge-state"); // Distinguish exercise endpoints and the symmetric midpoint.
  const data = JSON.parse(document.getElementById("gauge-samples").textContent); // Load precomputed field samples without duplicating physics formulas.
  const potentialPanel = root.querySelector("#potential-panel"); // Measure each subplot's real available width.
  const magneticPanel = root.querySelector("#magnetic-panel"); // Keep the physical field in a separate coordinate system.
  let current = 0; // Begin at Equation (8) unless the host supplies a valid saved choice.
  let potentialChart; // Retain geometry so slider changes only update vector marks.

  // Global: portable diagnostics; local: timestamp browser events without storing personal data.
  const log = (message) => console.info(`${new Date().toISOString()} gauge: ${message}`); // Browser verification captures these console records to a timestamped file.

  // Global: handle a blocked CDN honestly; local: show an accessible failure instead of a blank chart.
  if (!window.d3) {
    stateLabel.textContent = "Chart library unavailable. Connect to the internet and reload, or use the PDF figures."; // Explain the only external rendering dependency.
    stateLabel.setAttribute("role", "alert"); // Make the missing chart apparent to assistive technology.
    slider.disabled = true; // A slider cannot be used when its renderer failed to load.
    console.error(`${new Date().toISOString()} gauge: D3 failed to load`); // Preserve the actual rendering failure.
    return; // Do not emit follow-on JavaScript exceptions.
  }

  // Global: both plots preserve Cartesian aspect; local: derive scales and labels from measured container width.
  function makeChart(container, label, accessible) {
    const width = container.getBoundingClientRect().width; // Resize coordinates to this panel, not the whole browser window.
    const side = Math.max(1, width - 84); // Reserve 64 pixels for y labels and 20 on the opposite side.
    const height = side + 102; // Keep the plotting frame square while allowing titles and x labels.
    const x = d3.scaleLinear().domain([-data.limit, data.limit]).range([64, 64 + side]); // Use the same padded sampled domain as the static renderer.
    const y = d3.scaleLinear().domain([-data.limit, data.limit]).range([42 + side, 42]); // SVG y increases downwards, so invert only the screen mapping.
    const svg = d3.select(container).selectAll("svg").data([null]).join("svg").attr("class", "gauge-svg").attr("viewBox", `0 0 ${width} ${height}`).attr("role", "img").attr("aria-label", accessible); // Reuse one responsive SVG per panel.
    svg.selectAll("*").remove(); // Rebuild axes only when the panel size changes.
    svg.append("title").text(accessible); // Give nonvisual readers a concise description.
    svg.append("rect").attr("data-chart-frame", "").attr("x", 64).attr("y", 42).attr("width", side).attr("height", side).attr("fill", "none").attr("stroke", "var(--border)"); // Frame only the coordinate plane.
    svg.append("text").attr("x", 64).attr("y", 18).text(label); // Label the physical quantity without a decorative card.
    const ticks = d3.ticks(-data.extent, data.extent, width < 400 ? 2 : 4); // A target of two intervals keeps at most four ticks on a narrow panel.
    svg.append("g").attr("transform", `translate(0,${42 + side})`).call(d3.axisBottom(x).tickValues(ticks).tickSize(4)); // Draw the measured x axis.
    svg.append("g").attr("transform", "translate(64,0)").call(d3.axisLeft(y).tickValues(ticks).tickSize(4)); // Draw the measured y axis.
    svg.selectAll(".domain,.tick line").attr("stroke", "var(--border)"); // Keep axis strokes theme-aware and secondary.
    svg.append("line").attr("x1", x(0)).attr("x2", x(0)).attr("y1", 42).attr("y2", 42 + side).attr("stroke", "var(--border)"); // Mark the x=0 direction-change line.
    svg.append("line").attr("x1", 64).attr("x2", 64 + side).attr("y1", y(0)).attr("y2", y(0)).attr("stroke", "var(--border)"); // Mark the y=0 direction-change line.
    svg.append("text").attr("class", "axis-title").attr("data-axis", "x").attr("x", 64 + side / 2).attr("y", height - 8).attr("text-anchor", "middle").text("x (illustrative units)"); // State the coordinate's unit convention.
    svg.append("text").attr("class", "axis-title").attr("data-axis", "y").attr("transform", `translate(14,${42 + side / 2}) rotate(-90)`).attr("text-anchor", "middle").text("y (illustrative units)"); // Keep the y title outside numeric tick labels.
    return { svg, x, y }; // Share only the rendering primitives needed by each field.
  }

  // Global: honest quiver geometry; local: draw centered shafts and proportionate heads, omitting zero vectors.
  function arrowPath(chart, point, u, v) {
    const dx = (chart.x(u / data.scale) - chart.x(0)); // Convert the shared vector scale into horizontal pixels.
    const dy = (chart.y(v / data.scale) - chart.y(0)); // Preserve the physical sign when mapping to SVG coordinates.
    const length = Math.hypot(dx, dy); // Bound arrowheads by the actual on-screen vector length.
    if (length < 0.000001) return ""; // A zero vector must not acquire a phantom arrowhead.
    const cx = chart.x(point.x), cy = chart.y(point.y); // Place the arrow midpoint at the sampled coordinate.
    const tipX = cx + dx / 2, tipY = cy + dy / 2; // Center arrows exactly as in Matplotlib's middle pivot.
    const head = Math.min(4, length * 0.4), ux = dx / length, uy = dy / length; // Short vectors get smaller heads, not inverted shafts.
    return `M${cx-dx/2},${cy-dy/2}L${tipX},${tipY}M${tipX-head*ux-head*uy/2},${tipY-head*uy+head*ux/2}L${tipX},${tipY}L${tipX-head*ux+head*uy/2},${tipY-head*uy-head*ux/2}`; // Construct one continuous shaft and two head edges.
  }

  // Global: show continuous gauge freedom; local: interpolate the two exported endpoints with no repeated field formula.
  function updatePotential() {
    valueLabel.value = current.toFixed(2); // Native output keeps its accessible value synchronized.
    const selected = current === 0 ? "Equation (8)" : current === 1 ? "Equation (9)" : current === 0.5 ? "Symmetric gauge" : "Intermediate gauge"; // Identify important slider positions.
    stateLabel.textContent = `${selected} · Bz = ${data.b} throughout`; // The one-line status separates changing description from invariant field.
    potentialChart.svg.selectAll(".vector-mark").data(data.points).join("path").attr("class", "vector-mark").attr("d", point => { // Reuse marks without rerendering the physical field.
      const u = (1-current)*point.first[0] + current*point.second[0]; // Interpolate the sampled x component.
      const v = (1-current)*point.first[1] + current*point.second[1]; // Interpolate the sampled y component.
      return arrowPath(potentialChart, point, u, v); // Apply the same constant scale at every slider value.
    });
    potentialChart.svg.attr("aria-label", `Vector potential, gauge position ${current.toFixed(2)}, ${selected}`); // Keep the chart's text alternative current.
  }

  // Global: establish the invariant companion plot; local: draw dot/cross symbols for the configured field sign.
  function redraw() {
    potentialChart = makeChart(potentialPanel, "Vector potential A", "Vector potential in the xy plane"); // Recompute only screen geometry on resize.
    const magnetic = makeChart(magneticPanel, `Magnetic field · Bz = ${data.b}`, "Uniform magnetic field perpendicular to the xy plane"); // Give B its own labeled units and orientation.
    const marks = magnetic.svg.append("g").attr("data-magnetic-field", ""); // Browser tests can verify this entire group stays unchanged during sliding.
    if (data.b !== 0) { // A zero field has no direction symbols.
      const positions = data.points.filter(point => point.magnetic); // Use Python's shared grid subsampling.
      const groups = marks.selectAll("g").data(positions).join("g").attr("transform", point => `translate(${magnetic.x(point.x)},${magnetic.y(point.y)})`); // Place symbols on the same coordinate lattice.
      groups.append("circle").attr("class", "magnetic-mark").attr("r", 4).attr("fill", "none"); // Circle distinguishes a perpendicular vector from an in-plane arrow.
      if (data.b > 0) groups.append("circle").attr("r", 1.2).attr("fill", "var(--viz-series-1)"); // A dot represents an arrow coming out of the page.
      else groups.append("path").attr("class", "magnetic-mark").attr("d", "M-2,-2L2,2M-2,2L2,-2").attr("fill", "none"); // A cross represents an arrow going into the page.
    }
    const direction = data.b > 0 ? "Out of page (+z)" : data.b < 0 ? "Into page (−z)" : "Zero magnetic field"; // Label the symbols independently of color.
    magnetic.svg.append("text").attr("x", 64).attr("y", 34).text(direction); // Reserve a line above the plotted domain for orientation.
    updatePotential(); // Restore the user's current gauge after responsive resizing.
  }

  // Global: preserve a user's chosen gauge; local: accept only valid state from this visualization's version.
  function restore(state) {
    const saved = state?.modelContent; // The host may provide no previous interaction state.
    current = saved?.version === 1 && typeof saved.gauge === "number" && saved.gauge >= 0 && saved.gauge <= 1 ? saved.gauge : 0; // Reject incompatible or out-of-range state.
    slider.value = String(current); // Synchronize the native control without triggering an input event.
  }

  restore(window.openai?.widgetState); // Apply saved state before the first visible rendering.
  slider.addEventListener("input", () => { current = Number(slider.value); updatePotential(); }); // Native dragging updates arrows continuously and honors reduced-motion preferences without autonomous animation.
  slider.addEventListener("change", () => { // Save only a completed interaction, not every paint.
    window.openai?.setWidgetState?.({ modelContent: { version: 1, gauge: current, b: data.b }, privateContent: null })?.catch(() => {}); // Host persistence is optional and must not break standalone use.
    log(`selected gauge ${current.toFixed(2)}; Bz remains ${data.b}`); // Record observable changes for the verification log.
  });
  window.addEventListener("openai:set_globals", event => { // Follow host-restored choices without writing them back in a loop.
    if (event.detail?.globals?.widgetState) { restore(event.detail.globals.widgetState); updatePotential(); } // Repaint only when a new snapshot is present.
  });
  new ResizeObserver(redraw).observe(root); // Maintain equal aspect and readable labels as the conversation panel changes width.
  redraw(); // Show a useful initial field without waiting for interaction.
  log("visualization ready"); // Let browser checks distinguish a mounted chart from a blank document.
})();
