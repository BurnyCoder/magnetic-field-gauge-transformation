[project]
name = "gauge-fields"
version = "0.1.0"
description = "Reproducible plots and gauge transformations for Exercise 3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=4.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.4",
    "reportlab>=5.0.1",
]

[project.scripts]
gauge-fields = "gauge_fields.pipeline:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pypdf>=6.20.0",
    "pytest>=9.1.1",
]
